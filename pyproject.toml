[project]
name = "ak-dash"
version = "0.1.0"
description = "BFF do dashboard Akeel"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "google-api-python-client>=2.140",
    "google-auth>=2.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
